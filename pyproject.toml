[project]
name = "real_estate_ai_agent"
version = "0.1.0"
description = "real_estate_ai_agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.7",
    "streamlit>=1.58.0",
]

[project.scripts]
real_estate_ai_agent = "real_estate_ai_agent.main:run"
run_crew = "real_estate_ai_agent.main:run"
train = "real_estate_ai_agent.main:train"
replay = "real_estate_ai_agent.main:replay"
test = "real_estate_ai_agent.main:test"
run_with_trigger = "real_estate_ai_agent.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
